# 작업 대상 서버 목록
#
# Nginx / Django EC2 는 Private Subnet 에 있고 공인 IP 가 없습니다.
# 따라서 Ansible 은 Bastion 을 한 번 거쳐서(ProxyJump) 접속합니다.
#
#   Server1(Ansible) ──SSH──▶ Bastion(Public A) ──SSH──▶ Django(Private A)
#
# ⚠️ 이 파일의 IP는 전부 플레이스홀더입니다. VPC 10.23.0.0/16 설계 기준 예시 값입니다.
#
# ⚠️ 여기에 실제 IP를 적어서 커밋하지 마세요. 이 저장소는 Public 입니다.
#    특히 Bastion 공인 IP는 인터넷에 열린 유일한 SSH 입구라 그대로 노출됩니다.
#    (팀장님이 admin_cidr 를 terraform.tfvars 로 빼둔 것과 같은 이유입니다)
#
# 실제 값은 각자 로컬 사본에만 둡니다. *.local.ini 는 .gitignore 로 차단되어 있습니다.
#
#   cp inventory/prod.ini inventory/prod.local.ini
#   vi inventory/prod.local.ini          # 실제 IP 입력
#   ansible -i inventory/prod.local.ini django -m ping
#
# IP는 terraform output 으로 확인합니다:
#   cd environments/prod && terraform output

[django]
django-01 ansible_host=10.23.11.10    # ← terraform output django_base_private_ip

[nginx]
nginx-01 ansible_host=10.23.11.20     # ← 팀원3 담당

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/pharmaflow-infra-key.pem
ansible_python_interpreter=/usr/bin/python3

# Bastion 경유 설정
#
# ProxyCommand 의 -W 는 Bastion 을 "터널로만" 씁니다.
# 즉 Bastion 에 키 파일을 올려둘 필요가 없고, 인증은 전부 이쪽 키로 처리됩니다.
bastion_host=<BASTION-PUBLIC-IP>
ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p -q -i ~/.ssh/pharmaflow-infra-key.pem ubuntu@{{ bastion_host }}"'
