# 작업 대상 서버 목록
#
# ⚠️ IP는 아직 플레이스홀더입니다.
#    팀장님이 EC2를 만든 뒤 `terraform output` 으로 나온 사설 IP로 교체하세요.
#
# 교체 후 접속 확인:
#   ansible django -m ping

[django]
django-01 ansible_host=10.0.1.10    # ← 팀장 EC2 생성 후 교체

[nginx]
nginx-01 ansible_host=10.0.1.20     # ← 팀원3 담당

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/pharmaflow.pem
ansible_python_interpreter=/usr/bin/python3
