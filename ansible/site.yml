---
# 전체 배포 지휘서
#
# 실행:
#   cd ansible
#   ansible-playbook site.yml --ask-vault-pass
#
# Django 서버만:
#   ansible-playbook site.yml --limit django --ask-vault-pass

- name: Django 애플리케이션 서버 구성
  hosts: django
  become: true
  roles:
    - django

