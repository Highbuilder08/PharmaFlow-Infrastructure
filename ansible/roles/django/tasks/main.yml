---
# PharmaFlow Django 애플리케이션 서버 구성
# 근거: 앱 저장소의 deploy/manual/운영매뉴얼.md 8장(배포 및 유지보수)
#       앱 저장소의 deploy/SECURITY_AND_SETUP.md 1장(환경변수)
#
# ── 태그 ──────────────────────────────────────────────────────────
#   packages  OS 패키지 설치
#   app       소스 clone + venv/의존성
#   config    디렉터리·SECRET_KEY·.env·systemd 유닛·logrotate
#   storage   media 공유 스토리지 마운트 (EFS/NFS)
#   db        migrate / collectstatic   ← RDS 엔드포인트가 있어야 동작
#   service   서비스 활성화·기동
#
# RDS 생성 전에는 db 를 빼고 돌립니다:
#   ansible-playbook -i inventory/prod.local.ini site.yml \
#       --limit django --ask-vault-pass --skip-tags db
#
# ⚠️ --tags db 만 단독 실행해도 되도록 SECRET_KEY 로드 태스크에 db 태그를
#    같이 달아두었습니다. 빼면 migrate 가 django_secret_key is undefined 로 죽습니다.

# ── 1. OS 패키지 ──────────────────────────────────────────────────
- name: apt 캐시 갱신
  become: true
  apt:
    update_cache: true
    cache_valid_time: 3600      # 1시간 이내 갱신했으면 건너뜀
  tags: [packages]

- name: 빌드/런타임 패키지 설치
  become: true
  apt:
    name: "{{ django_apt_packages }}"
    state: present
  tags: [packages]

# ── 2. 소스 코드 ──────────────────────────────────────────────────
# ⚠️ 반드시 디렉터리 생성보다 먼저 와야 합니다.
#    git clone 은 대상 디렉터리가 "없거나 비어 있을 때"만 성공합니다.
#    app_dir/media 를 먼저 만들어두면 app_dir 이 비어있지 않게 되어
#    "fatal: destination path already exists and is not an empty directory" 로 실패합니다.
- name: PharmaFlow 소스 받기
  become: true
  become_user: "{{ django_user }}"
  git:
    repo: "{{ django_repo_url }}"
    dest: "{{ django_app_dir }}"
    version: "{{ django_repo_branch }}"
    force: true
  notify: gunicorn 재시작
  tags: [app]

# ── 3. 디렉터리 ───────────────────────────────────────────────────
# 저장소에 이미 있는 경로지만, 소유권/권한을 확정해 둡니다.
- name: 앱 디렉터리 권한 정리
  become: true
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ django_user }}"
    group: "{{ django_user }}"
    mode: "0755"
  loop:
    - "{{ django_app_dir }}"
    - "{{ django_app_dir }}/media"
    - "{{ django_app_dir }}/logs"
  tags: [config]

# ── 4. 파이썬 가상환경 ────────────────────────────────────────────
# mysqlclient 컴파일 때문에 1번 단계의 패키지가 반드시 먼저 깔려 있어야 합니다.
- name: 가상환경 생성 및 의존성 설치
  become: true
  become_user: "{{ django_user }}"
  pip:
    requirements: "{{ django_app_dir }}/requirements.txt"
    virtualenv: "{{ django_venv_dir }}"
    virtualenv_command: "python3 -m venv"
  notify: gunicorn 재시작
  tags: [app]

# ── 5. SECRET_KEY (최초 1회만 생성) ───────────────────────────────
# 매번 새로 만들면 기존 세션과 서명값이 전부 무효화되므로 creates: 로 고정합니다.
- name: SECRET_KEY 파일 생성 (최초 1회)
  become: true
  become_user: "{{ django_user }}"
  shell: |
    set -o pipefail
    openssl rand -base64 48 | tr -d '\n' > {{ django_app_dir }}/.secret_key
  args:
    creates: "{{ django_app_dir }}/.secret_key"
    executable: /bin/bash
  tags: [config]

- name: SECRET_KEY 파일 권한 조이기
  become: true
  file:
    path: "{{ django_app_dir }}/.secret_key"
    owner: "{{ django_user }}"
    group: "{{ django_user }}"
    mode: "0600"
  tags: [config]

# 아래 두 태스크는 서버를 바꾸지 않고 변수만 채웁니다.
# .env(config) 와 migrate(db) 양쪽이 이 값을 쓰기 때문에 always 로 둡니다.
# [config, db] 로 달면 --skip-tags db 가 config 까지 같이 지워서
# .env 배포가 "django_secret_key is undefined" 로 죽습니다.
- name: SECRET_KEY 읽어오기
  become: true
  slurp:
    src: "{{ django_app_dir }}/.secret_key"
  register: _secret_key_raw
  failed_when: false            # 아직 파일이 없는 단계(예: --tags packages)에서도 넘어가도록
  tags: [always]

- name: SECRET_KEY 변수에 담기
  set_fact:
    django_secret_key: "{{ _secret_key_raw.content | b64decode }}"
  no_log: true                  # 로그에 비밀키가 찍히지 않도록
  when: _secret_key_raw.content is defined
  tags: [always]

# ── 6. 환경변수 파일 ──────────────────────────────────────────────
- name: .env 배포
  become: true
  template:
    src: env.j2
    dest: "{{ django_app_dir }}/.env"
    owner: "{{ django_user }}"
    group: "{{ django_user }}"
    mode: "0640"                # 소유자만 읽기. DB 비밀번호가 들어감
  no_log: true
  notify: gunicorn 재시작
  tags: [config]

# ── 7. systemd 서비스 ─────────────────────────────────────────────
- name: pharmaflow.service 배포
  become: true
  template:
    src: pharmaflow.service.j2
    dest: "/etc/systemd/system/{{ django_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - systemd 데몬 리로드
    - gunicorn 재시작
  tags: [config]

# ── 8. media 공유 스토리지 마운트 ─────────────────────────────────
# EFS는 NFSv4.1 프로토콜을 씁니다. 권장 마운트 옵션은 AWS 문서 기준입니다.
- name: media 디렉터리에 EFS 마운트
  become: true
  mount:
    path: "{{ django_app_dir }}/media"
    src: "{{ django_efs_dns }}:/"
    fstype: nfs4
    opts: nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport,_netdev
    state: mounted
  when: django_media_storage == 'efs'
  tags: [storage]

- name: media 디렉터리에 NFS 마운트
  become: true
  mount:
    path: "{{ django_app_dir }}/media"
    src: "{{ django_nfs_server }}:{{ django_nfs_export }}"
    fstype: nfs
    opts: defaults,_netdev
    state: mounted
  when: django_media_storage == 'nfs'
  tags: [storage]

# 마운트하면 그 폴더의 소유자는 원격 스토리지 쪽 값으로 바뀝니다.
# Django(=ubuntu)가 업로드 파일을 쓸 수 있어야 하므로 다시 맞춰줍니다.
- name: 마운트된 media 소유권 보정
  become: true
  file:
    path: "{{ django_app_dir }}/media"
    state: directory
    owner: "{{ django_user }}"
    group: "{{ django_user }}"
  when: django_media_storage in ['efs', 'nfs']
  tags: [storage]

# ── 9. Django 관리 명령 ───────────────────────────────────────────
# 운영매뉴얼 8장의 migrate / collectstatic 절차
#
# ⚠️ environment: 가 반드시 필요합니다.
#    .env 파일은 systemd 의 EnvironmentFile 로만 읽힙니다.
#    Ansible 의 command 태스크는 그 파일을 모르기 때문에, 환경변수를 여기서
#    따로 넣어주지 않으면 settings.py 가 아래로 즉시 죽습니다.
#      RuntimeError: DJANGO_SECRET_KEY 환경변수가 필요합니다.
#
# ⚠️ django_db_host 가 RDS 엔드포인트로 교체되기 전에는 이 블록이 실패합니다.
#    그때까지는 --skip-tags db 로 건너뛰세요.
- name: Django 관리 명령 실행
  become: true
  become_user: "{{ django_user }}"
  environment:
    DJANGO_SECRET_KEY: "{{ django_secret_key }}"
    DJANGO_DEBUG: "{{ django_debug }}"
    DJANGO_ALLOWED_HOSTS: "{{ django_allowed_hosts | join(',') }}"
    DB_NAME: "{{ django_db_name }}"
    DB_USER: "{{ django_db_user }}"
    DB_PASSWORD: "{{ django_db_password }}"
    DB_HOST: "{{ django_db_host }}"
    DB_PORT: "{{ django_db_port }}"
    LOG_LEVEL: "{{ django_log_level }}"
  tags: [db]
  block:
    - name: DB 엔드포인트가 아직 플레이스홀더인지 확인
      assert:
        that: "'REPLACE-WITH' not in django_db_host"
        fail_msg: >-
          django_db_host 가 아직 플레이스홀더({{ django_db_host }})입니다.
          RDS 생성 전이라면 --skip-tags db 로 이 단계를 건너뛰고,
          RDS가 준비됐다면 roles/django/defaults/main.yml 의
          django_db_host 를 실제 엔드포인트로 교체하세요.
        quiet: true

    - name: DB 마이그레이션
      command: "{{ django_venv_dir }}/bin/python manage.py migrate --noinput"
      args:
        chdir: "{{ django_app_dir }}"
      register: _migrate
      changed_when: "'No migrations to apply' not in _migrate.stdout"

    - name: 정적 파일 수집
      command: "{{ django_venv_dir }}/bin/python manage.py collectstatic --noinput"
      args:
        chdir: "{{ django_app_dir }}"
      register: _collectstatic
      changed_when: "'0 static files copied' not in _collectstatic.stdout"

# ── 10. 로그 회전 ─────────────────────────────────────────────────
# 앱 저장소의 deploy/logrotate/pharmaflow 를 그대로 복사하면 안 됩니다.
# 그 파일은 개발 PC 기준으로 /home/tester/... 경로와 tester 계정이 박혀 있어서
# EC2(ubuntu 계정)에서는 회전이 동작하지 않습니다. 템플릿으로 값을 채워 넣습니다.
- name: logrotate 설정 배치
  become: true
  template:
    src: logrotate-pharmaflow.j2
    dest: /etc/logrotate.d/pharmaflow
    owner: root
    group: root
    mode: "0644"
  tags: [config]

- name: logrotate 설정 문법 검사
  become: true
  command: logrotate -d /etc/logrotate.d/pharmaflow
  changed_when: false
  tags: [config]

# ── 11. 서비스 기동 ───────────────────────────────────────────────
# RDS 전에도 기동 자체는 됩니다(Django는 시작 시 DB에 연결하지 않습니다).
# 다만 DB를 건드리는 요청은 500이 납니다. 정상입니다.
- name: pharmaflow 서비스 활성화 및 시작
  become: true
  systemd:
    name: "{{ django_service_name }}"
    state: started
    enabled: true               # 재부팅 후 자동 시작
    daemon_reload: true
  tags: [service]
