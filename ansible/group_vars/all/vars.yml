---
# 모든 서버에 공통 적용되는 변수 (비밀값 아님 - 커밋해도 됨)
#
# ⚠️ 비밀번호·API 키는 여기 쓰지 마세요.
#    같은 폴더의 vault.yml 에 넣습니다.
#    vault.yml 은 .gitignore 로 커밋이 차단되어 있습니다.
#
# ⚠️ 실제 환경 IP/DNS 값은 공용 Git 코드에 넣지 않습니다.
#    팀장 Server1의 group_vars/all/local.yml 에서 실제 값으로 덮어씁니다.

# ── 서버 사설 IP ──────────────────────────────────────────────────
django_private_ip: "REPLACE-WITH-DJANGO-PRIVATE-IP"
nginx_private_ip: "REPLACE-WITH-NGINX-PRIVATE-IP"

# ── Django ALLOWED_HOSTS ──────────────────────────────────────────
# 초기 구축:
#   Nginx → Django Private IP:8000
#
# 최종 구축:
#   Nginx → Internal ALB → Django ASG
django_allowed_hosts:
  - "{{ django_private_ip }}"
  - "{{ nginx_private_ip }}"

# ── EFS 공용 스토리지 ─────────────────────────────────────────────
# 실제 EFS DNS는 group_vars/all/local.yml 에서 설정합니다.
efs_dns: "REPLACE-WITH-EFS-DNS"

# ── DB ────────────────────────────────────────────────────────────
# django_db_host 는 이 파일에 두지 않습니다.
#
# roles/django/defaults/main.yml 의 RDS 엔드포인트를 사용하고,
# 실제 RDS 생성 후 Terraform output 값으로 교체합니다.
#
# group_vars 는 role defaults 보다 우선순위가 높기 때문에
# 이곳에 django_db_host 를 정의하면 Django Role 설정을 덮어씁니다.