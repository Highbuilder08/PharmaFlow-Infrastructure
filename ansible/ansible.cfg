[defaults]
# 매번 -i 옵션 안 쓰도록 기본 인벤토리 지정
inventory = inventory/prod.ini
roles_path = roles

# 출력을 사람이 읽기 좋게
stdout_callback = yaml
display_skipped_hosts = False

# facts 캐시로 재실행 속도 개선
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

# 참고) 새 EC2에 처음 접속하면 호스트 키를 신뢰할지 묻습니다.
#      host_key_checking=False 로 끄는 예제가 많지만 중간자 공격에 노출되므로 쓰지 마세요.
#      대신 EC2 생성 후 아래 명령으로 키를 미리 등록해 두면 질문 없이 진행됩니다:
#         ssh-keyscan -H 10.0.1.10 >> ~/.ssh/known_hosts

[ssh_connection]
# 접속 재사용으로 속도 개선
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
